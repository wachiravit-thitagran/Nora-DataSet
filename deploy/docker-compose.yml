# Deployment on ainora-agent.
#
# The dataset bundles ship inside the image (see the Dockerfile), so the only
# storage left is the database — the one thing this service writes. It lives in
# a named Docker volume, not a host directory: the Jenkins agent has no rights
# under /srv, and a named volume needs no directory created, no ownership set,
# and no permissions granted on the host.
#
# The project name is pinned so the volume keeps the same identity no matter
# which directory the compose file is run from. Without it, Compose derives the
# project from the working directory, and a deploy from a different Jenkins
# workspace would silently attach a fresh, empty database.

name: nora-dataset

services:
  dataset-web:
    # Supplied by the Jenkins deploy stage, pinned to the commit being shipped.
    # No default on purpose: a manual `docker compose up` without it should say
    # so rather than quietly resurrect whatever :latest happens to be.
    image: ${IMAGE:?IMAGE must be set, e.g. $REGISTRY_URL/diis-itoc/nora-dataset:abc1234}
    container_name: ainora-dataset-web
    restart: unless-stopped

    # Bind to loopback only. The service is reachable exclusively through the
    # host nginx, never directly from the network.
    ports:
      - "127.0.0.1:10095:8000"

    environment:
      # Required. Generate once with: openssl rand -hex 32
      # Rotating this value immediately invalidates every outstanding
      # download token.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}

      # Inside the image, not a mount. Bundles resolve to
      # DATA_DIR/<version>/<filename>.
      DATA_DIR: /srv/app/data/bundles
      DB_PATH: /var/lib/nora/access.sqlite3
      ROOT_PATH: /dataset

      # nginx reserves only /dataset/ and proxies everything to this service,
      # so the application serves the bundle bytes itself.
      USE_XACCEL: "false"
      TRUST_FORWARDED_FOR: "true"

      # Overridable from the env file, so changing a policy value does not mean
      # editing this file on the server. RETENTION_DAYS in particular may have
      # to follow whatever the PDPA notice ends up promising.
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-86400}"
      RETENTION_DAYS: "${RETENTION_DAYS:-730}"
      RATE_LIMIT_PER_HOUR: "${RATE_LIMIT_PER_HOUR:-10}"

    volumes:
      - nora-dataset-db:/var/lib/nora

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp:size=64m

volumes:
  nora-dataset-db:
    # Explicit name, so the volume is not prefixed with the project name and
    # stays findable as `docker volume inspect nora-dataset-db`.
    #
    # It holds the PDPA-governed access records. Never run a bare
    # `docker volume prune` on this host: during a deploy the container is
    # briefly recreated, and a prune in that window would take the database
    # with it.
    name: nora-dataset-db
