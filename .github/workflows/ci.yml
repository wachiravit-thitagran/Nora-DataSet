name: CI

# Fast feedback on pull requests: lint, tests, catalogue validation.
#
# Building and publishing the image is Jenkins' job, not this workflow's.
# The image goes to the PSU registry ($REGISTRY_URL) which is not reachable
# from GitHub-hosted runners, and Jenkins already holds the ci-bot
# credential. See the Jenkinsfile.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir ruff==0.8.4
      - run: ruff check app scripts tests
      - run: ruff format --check app scripts tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --no-cache-dir -r requirements.txt pytest==8.3.4 httpx==0.28.1
      - env:
          # Test-only value. The real key lives in Jenkins credentials and is
          # never committed or stored as a repository secret.
          SECRET_KEY: ci-only-not-a-real-secret-padding-0000000000
        run: python -m pytest tests -v

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Guards against malformed JSON reaching production, and against a
      # bundle entry that claims a file the manifest does not describe.
      - run: python scripts/validate_catalog.py
