name: CI

# Replaces the previous .gitlab-ci.yml. Same four checks, same order:
# lint, tests, catalogue validation, then build and publish the image.
# Deployment stays with Jenkins on ainora-agent.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir ruff==0.8.4
      - run: ruff check app scripts tests
      - run: ruff format --check app scripts tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --no-cache-dir -r requirements.txt pytest==8.3.4 httpx==0.28.1
      - env:
          # Test-only value. The real key lives in Jenkins credentials and is
          # never committed or stored as a repository secret.
          SECRET_KEY: ${{ 'ci-only-not-a-real-secret-padding-0000000000' }}
        run: python -m pytest tests -v

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Guards against malformed JSON reaching production, and against a
      # bundle entry that claims a file the manifest does not describe.
      - run: python scripts/validate_catalog.py

  build:
    needs: [lint, test, catalog]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Deploy with the Jenkins job on ainora-agent, passing"
            echo "IMAGE_TAG=\`${GITHUB_SHA::7}\`."
          } >> "$GITHUB_STEP_SUMMARY"
